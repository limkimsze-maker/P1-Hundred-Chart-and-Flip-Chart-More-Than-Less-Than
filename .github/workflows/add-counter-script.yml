name: Add Counter.dev script

on:
  push:
    paths:
      - .github/workflows/add-counter-script.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Counter.dev script before closing head
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          tag = '<script src="https://cdn.counter.dev/script.js" data-id="825e93b6-ce99-40ef-8bcc-125f13297433" data-utcoffset="8"></script>'

          if tag not in html:
              if "</head>" not in html:
                  raise SystemExit("Could not find </head> in index.html")
              html = html.replace("</head>", f"  {tag}\n</head>", 1)
              path.write_text(html, encoding="utf-8")

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/add-counter-script.yml
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-counter-script.yml
          git commit -m "Add Counter.dev tracking script"
          git push
