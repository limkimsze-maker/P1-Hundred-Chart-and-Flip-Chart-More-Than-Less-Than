name: Boost counter clink sound

on:
  push:
    paths:
      - .github/workflows/boost-counter-clink.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace counter sound with clearer metallic clink
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.html")
          html = path.read_text(encoding="utf-8")
          start_marker = "  function counterMoveSound(direction=1){"
          end_marker = "\n  function writeStatic(card,digit){"

          start = html.find(start_marker)
          end = html.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("Could not locate counterMoveSound function")

          replacement = r'''  function counterMoveSound(direction=1){
    if(!soundOn) return;
    ensureAudio();
    const ctx=audioCtx;
    const t=ctx.currentTime;

    // A bright metallic counter clink that remains audible on phone,
    // Chromebook and projector speakers. It is deliberately centred rather
    // than hard-panned so mono/mobile speakers do not lose the sound.
    const master=ctx.createGain();
    master.gain.setValueAtTime(0.95,t);
    master.gain.exponentialRampToValueAtTime(0.001,t+0.34);
    master.connect(ctx.destination);

    const partials=[
      [780,0.34,0.18],
      [1180,0.27,0.15],
      [1760,0.20,0.12],
      [2380,0.13,0.10]
    ];

    partials.forEach(([freq,level,duration],i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type=i<2?'triangle':'sine';
      osc.frequency.setValueAtTime(freq,t);
      osc.frequency.exponentialRampToValueAtTime(freq*0.84,t+duration);
      gain.gain.setValueAtTime(0.001,t);
      gain.gain.exponentialRampToValueAtTime(level,t+0.004);
      gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
      osc.connect(gain).connect(master);
      osc.start(t);
      osc.stop(t+duration+0.02);
    });

    // Sharp initial metal contact, useful on small speakers.
    const clickBuffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.045),ctx.sampleRate);
    const clickData=clickBuffer.getChannelData(0);
    for(let i=0;i<clickData.length;i++){
      const p=i/clickData.length;
      clickData[i]=(Math.random()*2-1)*Math.pow(1-p,3.2);
    }
    const click=ctx.createBufferSource();
    click.buffer=clickBuffer;
    const high=ctx.createBiquadFilter();
    high.type='highpass';
    high.frequency.value=950;
    const clickGain=ctx.createGain();
    clickGain.gain.value=0.78;
    click.connect(high).connect(clickGain).connect(master);
    click.start(t);

    // A second lighter clink makes the landing unmistakable.
    const t2=t+0.105;
    [980,1480,2160].forEach((freq,i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='sine';
      osc.frequency.setValueAtTime(freq,t2);
      gain.gain.setValueAtTime(0.001,t2);
      gain.gain.exponentialRampToValueAtTime([0.23,0.16,0.10][i],t2+0.003);
      gain.gain.exponentialRampToValueAtTime(0.001,t2+0.105);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t2);
      osc.stop(t2+0.12);
    });
  }
'''

          html = html[:start] + replacement + html[end:]
          path.write_text(html, encoding="utf-8")

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/boost-counter-clink.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html .github/workflows/boost-counter-clink.yml
          git commit -m "Make counter landing clink clearly audible"
          git push
